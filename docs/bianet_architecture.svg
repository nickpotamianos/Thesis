<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 600 20px 'Helvetica Neue', Arial, sans-serif; fill: #1f2933; }
      .subtitle { font: 400 14px 'Helvetica Neue', Arial, sans-serif; fill: #4b5563; }
      .label { font: 500 14px 'Helvetica Neue', Arial, sans-serif; fill: #1f2933; letter-spacing: 0.4px; }
      .note { font: 400 12px 'Helvetica Neue', Arial, sans-serif; fill: #4b5563; }
      .node { fill: #ffffff; stroke: #1f2933; stroke-width: 1.6; }
      .link { stroke: #94a3b8; stroke-width: 1.3; }
      .bg { fill: #f8fafc; stroke: #d6dee6; stroke-width: 1.2; }
      .arrowhead { fill: #1f2933; }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="6" refX="7" refY="3" orient="auto" class="arrowhead">
      <polygon points="0 0, 7 3, 0 6" />
    </marker>
  </defs>

  <rect x="32" y="68" width="896" height="264" rx="20" class="bg" />

  <text x="52" y="42" class="title">BiasNet Bias Regression Network</text>
  <text x="52" y="64" class="subtitle">Two-layer perceptron for UWB range bias correction</text>

  <!-- Input layer -->
  <g id="input-layer">
    <text x="120" y="104" class="label">Input Features (d)</text>
    <text x="120" y="122" class="note">Measurement context vector</text>
    <circle cx="150" cy="160" r="16" class="node" />
    <circle cx="150" cy="205" r="16" class="node" />
    <circle cx="150" cy="250" r="16" class="node" />
    <circle cx="150" cy="295" r="16" class="node" />
  </g>

  <!-- Hidden layer 1 -->
  <g id="hidden1">
    <text x="340" y="104" class="label">Hidden Layer 1</text>
    <text x="340" y="122" class="note">Linear (d × 64) + ReLU</text>
    <circle cx="370" cy="150" r="16" class="node" />
    <circle cx="370" cy="195" r="16" class="node" />
    <circle cx="370" cy="240" r="16" class="node" />
    <circle cx="370" cy="285" r="16" class="node" />
  </g>

  <!-- Hidden layer 2 -->
  <g id="hidden2">
    <text x="560" y="104" class="label">Hidden Layer 2</text>
    <text x="560" y="122" class="note">Linear (64 × 64) + ReLU</text>
    <circle cx="590" cy="150" r="16" class="node" />
    <circle cx="590" cy="195" r="16" class="node" />
    <circle cx="590" cy="240" r="16" class="node" />
    <circle cx="590" cy="285" r="16" class="node" />
  </g>

  <!-- Output layer -->
  <g id="output">
    <text x="760" y="104" class="label">Output Bias (m)</text>
    <text x="760" y="122" class="note">Linear (64 → 1)</text>
    <circle cx="790" cy="220" r="18" class="node" />
  </g>

  <!-- Connections -->
  <g>
    <line x1="166" y1="160" x2="354" y2="150" class="link" />
    <line x1="166" y1="160" x2="354" y2="195" class="link" />
    <line x1="166" y1="160" x2="354" y2="240" class="link" />
    <line x1="166" y1="160" x2="354" y2="285" class="link" />

    <line x1="166" y1="205" x2="354" y2="150" class="link" />
    <line x1="166" y1="205" x2="354" y2="195" class="link" />
    <line x1="166" y1="205" x2="354" y2="240" class="link" />
    <line x1="166" y1="205" x2="354" y2="285" class="link" />

    <line x1="166" y1="250" x2="354" y2="150" class="link" />
    <line x1="166" y1="250" x2="354" y2="195" class="link" />
    <line x1="166" y1="250" x2="354" y2="240" class="link" />
    <line x1="166" y1="250" x2="354" y2="285" class="link" />

    <line x1="166" y1="295" x2="354" y2="150" class="link" />
    <line x1="166" y1="295" x2="354" y2="195" class="link" />
    <line x1="166" y1="295" x2="354" y2="240" class="link" />
    <line x1="166" y1="295" x2="354" y2="285" class="link" />
  </g>

  <g>
    <line x1="386" y1="150" x2="574" y2="150" class="link" />
    <line x1="386" y1="150" x2="574" y2="195" class="link" />
    <line x1="386" y1="150" x2="574" y2="240" class="link" />
    <line x1="386" y1="150" x2="574" y2="285" class="link" />

    <line x1="386" y1="195" x2="574" y2="150" class="link" />
    <line x1="386" y1="195" x2="574" y2="195" class="link" />
    <line x1="386" y1="195" x2="574" y2="240" class="link" />
    <line x1="386" y1="195" x2="574" y2="285" class="link" />

    <line x1="386" y1="240" x2="574" y2="150" class="link" />
    <line x1="386" y1="240" x2="574" y2="195" class="link" />
    <line x1="386" y1="240" x2="574" y2="240" class="link" />
    <line x1="386" y1="240" x2="574" y2="285" class="link" />

    <line x1="386" y1="285" x2="574" y2="150" class="link" />
    <line x1="386" y1="285" x2="574" y2="195" class="link" />
    <line x1="386" y1="285" x2="574" y2="240" class="link" />
    <line x1="386" y1="285" x2="574" y2="285" class="link" />
  </g>

  <g>
    <line x1="606" y1="150" x2="774" y2="220" class="link" marker-end="url(#arrowhead)" />
    <line x1="606" y1="195" x2="774" y2="220" class="link" marker-end="url(#arrowhead)" />
    <line x1="606" y1="240" x2="774" y2="220" class="link" marker-end="url(#arrowhead)" />
    <line x1="606" y1="285" x2="774" y2="220" class="link" marker-end="url(#arrowhead)" />
  </g>

  <text x="260" y="326" class="note">Optional feature normalization (μ, σ buffers) applied before the first layer when configured</text>
</svg>
