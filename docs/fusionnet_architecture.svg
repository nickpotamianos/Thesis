<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1100" height="380" viewBox="0 0 1100 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 600 20px 'Helvetica Neue', Arial, sans-serif; fill: #1f2933; }
      .subtitle { font: 400 14px 'Helvetica Neue', Arial, sans-serif; fill: #4b5563; }
      .label { font: 500 14px 'Helvetica Neue', Arial, sans-serif; fill: #1f2933; }
      .note { font: 400 12px 'Helvetica Neue', Arial, sans-serif; fill: #4b5563; }
      .node { fill: #ffffff; stroke: #1f2933; stroke-width: 1.6; }
      .link { stroke: #94a3b8; stroke-width: 1.4; }
      .bg { fill: #f8fafc; stroke: #d6dee6; stroke-width: 1.2; }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#1f2933">
      <polygon points="0 0, 8 3, 0 6" />
    </marker>
  </defs>

  <rect x="40" y="70" width="1020" height="260" rx="20" class="bg" />

  <text x="60" y="44" class="title">FusionNet Per-Node Weighting Network</text>
  <text x="60" y="64" class="subtitle">Shared MLP that maps 11-D tracker features to normalized CI weights</text>

  <!-- Input column -->
  <g transform="translate(120, 0)">
    <text x="40" y="110" class="label" text-anchor="middle">Input Features</text>
    <text x="40" y="128" class="note" text-anchor="middle">d = 11 per node</text>
    <circle cx="40" cy="160" r="16" class="node" />
    <circle cx="40" cy="205" r="16" class="node" />
    <circle cx="40" cy="250" r="16" class="node" />
    <circle cx="40" cy="295" r="16" class="node" />
  </g>

  <!-- Hidden layer 1 -->
  <g transform="translate(360, 0)">
    <text x="40" y="110" class="label" text-anchor="middle">Hidden Layer 1</text>
    <text x="40" y="128" class="note" text-anchor="middle">Linear (d → 64) · ReLU</text>
    <circle cx="40" cy="140" r="16" class="node" />
    <circle cx="40" cy="185" r="16" class="node" />
    <circle cx="40" cy="230" r="16" class="node" />
    <circle cx="40" cy="275" r="16" class="node" />
  </g>

  <!-- Hidden layer 2 -->
  <g transform="translate(600, 0)">
    <text x="40" y="110" class="label" text-anchor="middle">Hidden Layer 2</text>
    <text x="40" y="128" class="note" text-anchor="middle">Linear (64 → 64) · Dropout 0.10 · ReLU</text>
    <circle cx="40" cy="140" r="16" class="node" />
    <circle cx="40" cy="185" r="16" class="node" />
    <circle cx="40" cy="230" r="16" class="node" />
    <circle cx="40" cy="275" r="16" class="node" />
  </g>

  <!-- Score output -->
  <g transform="translate(830, 0)">
    <text x="40" y="110" class="label" text-anchor="middle">Score</text>
    <text x="40" y="128" class="note" text-anchor="middle">Linear (64 → 1)</text>
    <circle cx="40" cy="210" r="18" class="node" />
  </g>

  <!-- Softmax -->
  <g transform="translate(980, 0)">
    <text x="40" y="110" class="label" text-anchor="middle">Softmax</text>
    <text x="40" y="128" class="note" text-anchor="middle">w₁ … w_M</text>
    <circle cx="40" cy="210" r="18" class="node" />
  </g>

  <!-- Connections -->
  <g>
    <!-- Input to hidden1 -->
    <line x1="176" y1="160" x2="384" y2="140" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="160" x2="384" y2="185" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="160" x2="384" y2="230" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="160" x2="384" y2="275" class="link" marker-end="url(#arrowhead)" />

    <line x1="176" y1="205" x2="384" y2="140" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="205" x2="384" y2="185" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="205" x2="384" y2="230" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="205" x2="384" y2="275" class="link" marker-end="url(#arrowhead)" />

    <line x1="176" y1="250" x2="384" y2="140" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="250" x2="384" y2="185" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="250" x2="384" y2="230" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="250" x2="384" y2="275" class="link" marker-end="url(#arrowhead)" />

    <line x1="176" y1="295" x2="384" y2="140" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="295" x2="384" y2="185" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="295" x2="384" y2="230" class="link" marker-end="url(#arrowhead)" />
    <line x1="176" y1="295" x2="384" y2="275" class="link" marker-end="url(#arrowhead)" />

    <!-- Hidden1 to hidden2 -->
    <line x1="416" y1="140" x2="624" y2="140" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="140" x2="624" y2="185" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="140" x2="624" y2="230" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="140" x2="624" y2="275" class="link" marker-end="url(#arrowhead)" />

    <line x1="416" y1="185" x2="624" y2="140" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="185" x2="624" y2="185" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="185" x2="624" y2="230" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="185" x2="624" y2="275" class="link" marker-end="url(#arrowhead)" />

    <line x1="416" y1="230" x2="624" y2="140" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="230" x2="624" y2="185" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="230" x2="624" y2="230" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="230" x2="624" y2="275" class="link" marker-end="url(#arrowhead)" />

    <line x1="416" y1="275" x2="624" y2="140" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="275" x2="624" y2="185" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="275" x2="624" y2="230" class="link" marker-end="url(#arrowhead)" />
    <line x1="416" y1="275" x2="624" y2="275" class="link" marker-end="url(#arrowhead)" />

    <!-- Hidden2 to score -->
    <line x1="656" y1="140" x2="854" y2="210" class="link" marker-end="url(#arrowhead)" />
    <line x1="656" y1="185" x2="854" y2="210" class="link" marker-end="url(#arrowhead)" />
    <line x1="656" y1="230" x2="854" y2="210" class="link" marker-end="url(#arrowhead)" />
    <line x1="656" y1="275" x2="854" y2="210" class="link" marker-end="url(#arrowhead)" />

    <!-- Score to softmax -->
    <line x1="886" y1="210" x2="1004" y2="210" class="link" marker-end="url(#arrowhead)" />
  </g>

  <text x="340" y="320" class="note">Feature normalization (if provided) precedes the first layer and is shared across trackers.</text>
</svg>
